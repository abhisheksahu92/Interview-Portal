<tr id="pref-row-{{ row.event.name }}">
  <th scope="row">
    {{ row.event.label }}
    <div class="ip-muted small fw-normal">{{ row.event.description }}</div>
  </th>
  {% for cell in row.cells %}
    <td class="ip-toggle-cell">
      {% if cell.supported %}
        <button type="button" class="ip-toggle"
                hx-post="{% url 'notifications:toggle' row.event.name cell.channel %}"
                hx-target="#pref-row-{{ row.event.name }}"
                hx-swap="outerHTML"
                aria-pressed="{% if cell.enabled %}true{% else %}false{% endif %}"
                aria-label="{{ cell.label }} for {{ row.event.label }}">
          {% if cell.enabled %}On{% else %}Off{% endif %}
        </button>
      {% else %}
        <span class="ip-muted small">n/a</span>
      {% endif %}
    </td>
  {% endfor %}
</tr>
