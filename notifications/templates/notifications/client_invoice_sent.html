<div style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.6;color:#111">
  <p>Hello,</p>
  <p>Invoice <strong>{{ invoice_number }}</strong> for {{ period }} is attached.</p>
  <p style="padding:10px 14px;background:#f3f4f6;border-radius:6px;margin:0 0 16px">Amount due: <strong>INR {{ total }}</strong>{% if due_at %} by {{ due_at }}{% endif %}</p>
  <p>Thank you for your business.</p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:20px 0">
  <p style="font-size:12px;color:#6b7280">&mdash; {{ site_name }}</p>
</div>
