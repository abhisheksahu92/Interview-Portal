<div style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.6;color:#111">
  <p>Hello,</p>
  <p>A new candidate has been submitted to <strong>{{ client }}</strong> for
    <strong>{{ job }}</strong>:</p>
  <p style="padding:10px 14px;background:#f3f4f6;border-radius:6px;margin:0 0 16px">{{ candidate }}</p>
  <p>Sign in with your client portal link to read their profile, view the resume and leave feedback.</p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:20px 0">
  <p style="font-size:12px;color:#6b7280">&mdash; {{ site_name }}</p>
</div>
