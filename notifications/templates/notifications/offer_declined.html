<div style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.6;color:#111">
  <p><strong>{{ candidate_name }}</strong> has declined the offer for
    <strong>{{ job_title }}</strong>.</p>
  <p>Reason given: {{ decline_reason|default:"(none given)" }}</p>
  <p>The application is still open, so you can re-open the pipeline or send a revised offer.</p>
  <p><a href="{{ offer_url }}" style="background:#2563eb;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none">Open the offer</a></p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:20px 0">
  <p style="font-size:12px;color:#6b7280">&mdash; {{ site_name }}</p>
</div>
