{% extends "base.html" %}
{% block title %}Booking link expired{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="ip-card p-4 text-center">
      <i class="bi bi-hourglass-bottom display-5 text-warning" aria-hidden="true"></i>
      <h1 class="h4 mt-2">This booking link has expired</h1>
      <p class="text-body-secondary mb-0">
        Please contact {{ interview.company.name }} and ask for a fresh interview invitation.
      </p>
    </div>
  </div>
</div>
{% endblock %}
