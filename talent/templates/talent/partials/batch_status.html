<section class="ip-section"
         {% if not batch.is_finished %}hx-get="{% url 'talent:batch_status' batch.pk %}"
         hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  <div class="ip-section__head">
    <h2>Progress</h2>
    <span class="ip-badge ip-badge--{% if batch.status == 'DONE' %}success{% elif batch.status == 'FAILED' %}danger{% else %}neutral{% endif %}">
      {{ batch.get_status_display }}
    </span>
  </div>
  <div class="ip-meter-row mb-4">
    <div class="ip-meter__head">
      <span class="ip-meter__name">Items processed</span>
      <span class="ip-meter__value">{{ batch.percent }}%</span>
    </div>
    <div class="ip-meter" role="progressbar" aria-label="Import progress"
         aria-valuenow="{{ batch.percent }}" aria-valuemin="0" aria-valuemax="100">
      <span class="ip-meter__fill" style="--pct:{{ batch.percent }}"></span>
    </div>
  </div>
  <div class="ip-bento">
    <div class="ip-bento__tile ip-kpi">
      <div class="ip-kpi__label">items</div><div class="ip-kpi__value">{{ batch.total }}</div>
    </div>
    <div class="ip-bento__tile ip-kpi">
      <div class="ip-kpi__label">created</div><div class="ip-kpi__value">{{ batch.created }}</div>
    </div>
    <div class="ip-bento__tile ip-kpi">
      <div class="ip-kpi__label">updated</div><div class="ip-kpi__value">{{ batch.updated }}</div>
    </div>
    <div class="ip-bento__tile ip-kpi">
      <div class="ip-kpi__label">skipped</div><div class="ip-kpi__value">{{ batch.skipped }}</div>
    </div>
  </div>
</section>
