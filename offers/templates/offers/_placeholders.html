<section class="ip-section ip-section--tight">
  <div class="ip-section__head"><h2>Placeholders</h2></div>
  <dl class="ip-kv">
    {% for name, help in placeholders %}
      <dt><code>{% templatetag openvariable %}{{ name }}{% templatetag closevariable %}</code></dt>
      <dd>{{ help }}</dd>
    {% endfor %}
  </dl>
  <p class="ip-muted small mb-0 mt-3">
    Only these names are substituted. Anything else stays as plain text — template
    tags are never executed.
  </p>
</section>
