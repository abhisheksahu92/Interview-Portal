{% if offer.status == "ACCEPTED" %}<span class="ip-badge ip-badge--success">Accepted</span>
{% elif offer.status == "DECLINED" %}<span class="ip-badge ip-badge--danger">Declined</span>
{% elif offer.status == "SENT" %}<span class="ip-badge ip-badge--accent">Sent</span>
{% elif offer.status == "VIEWED" %}<span class="ip-badge ip-badge--info">Viewed</span>
{% elif offer.status == "WITHDRAWN" %}<span class="ip-badge ip-badge--neutral">Withdrawn</span>
{% elif offer.status == "EXPIRED" %}<span class="ip-badge ip-badge--warning">Expired</span>
{% else %}<span class="ip-badge ip-badge--light">Draft</span>{% endif %}
