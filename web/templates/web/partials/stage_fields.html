{% if form.non_field_errors %}
  <div class="alert alert-danger py-1 px-2 small">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="mb-3 {% if field.name == 'requires_assessment' %}form-check{% endif %}">
    {% if field.name == 'requires_assessment' %}
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% else %}
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
