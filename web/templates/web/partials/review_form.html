<form class="ip-review" id="review-form-{{ application.pk }}"
      hx-post="{% url 'web:application_review' application.pk %}"
      hx-target="#app-card-{{ application.pk }}" hx-swap="outerHTML">
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="alert alert-danger py-1 px-2 small">{{ form.non_field_errors }}</div>
  {% endif %}
  <div class="mb-2">
    <label class="form-label small mb-1" for="{{ form.decision.id_for_label }}">Decision</label>
    {{ form.decision }}
    {% for e in form.decision.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
  <div class="mb-2">
    <label class="form-label small mb-1" for="{{ form.rating.id_for_label }}">Rating</label>
    {{ form.rating }}
  </div>
  <div class="mb-2">
    <label class="form-label small mb-1" for="{{ form.feedback.id_for_label }}">Feedback</label>
    {{ form.feedback }}
  </div>
  <p class="ip-muted small mb-2">
    A pass advances this application to the next stage; a fail rejects it.
  </p>
  <button class="btn btn-sm btn-primary" type="submit">Save review</button>
</form>
