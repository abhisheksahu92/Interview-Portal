{% extends "base.html" %}{% load static %}
{% block title %}Open roles{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{% static 'web/app.css' %}">{% endblock %}
{% block content %}
<h1 class="h3 mb-1">Open roles</h1>
<p class="ip-muted">Openings published by every company on Interview Portal.</p>

<form class="ip-section mb-4" role="search"
      hx-get="{% url 'web:job_browse' %}" hx-target="#job-results" hx-swap="outerHTML"
      hx-trigger="submit, keyup changed delay:400ms from:#q">
  <label class="form-label" for="q">Search by title, location or skill</label>
  <div class="d-flex gap-2">
    <input class="form-control" type="search" id="q" name="q" value="{{ q }}"
           placeholder="e.g. Django, Pune, contract">
    <button class="btn btn-primary" type="submit">Search</button>
  </div>
</form>

{% include "web/partials/job_results.html" %}
{% endblock %}
