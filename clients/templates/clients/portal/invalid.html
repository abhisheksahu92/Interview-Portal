<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Link no longer valid</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:34rem">
  <div class="bg-white border rounded-3 p-4">
    <h1 class="h4">This link is no longer valid</h1>
    <p class="text-muted mb-3">
      Your candidate review link has expired or was revoked.
    </p>
    <p class="mb-0">
      Please contact your recruiting partner
      {% if client and client.company %}at <strong>{{ client.company.name }}</strong>{% endif %}
      to have a fresh link sent to you.
    </p>
  </div>
</main>
</body>
</html>
