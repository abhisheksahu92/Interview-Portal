{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Delete {{ kind }}</h1>
<p>Really delete <strong>{{ object }}</strong>? This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Delete</button>
</form>
{% endblock %}
{% block scripts %}{% endblock %}
