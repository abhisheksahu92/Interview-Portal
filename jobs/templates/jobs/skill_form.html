{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit skill{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit skill</h1>
<form method="post" class="col-lg-6">
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-link" href="{% url 'jobs:skill_list' %}">Cancel</a>
</form>
<form method="post" action="{% url 'jobs:skill_delete' skill.pk %}" class="mt-4">
  {% csrf_token %}
  <button class="btn btn-outline-danger btn-sm" type="submit">Delete skill</button>
</form>
{% endblock %}
{% block scripts %}{% endblock %}
