{% comment %}Shared data-viz tokens. Light values on :root; dark re-declared for the theme stamp.
The card / KPI / empty-state chrome lives in web/static/web/app.css (agent 3 section);
only the chart palette itself is declared here so the Chart.js config keeps reading it.{% endcomment %}
<style>
  .viz {
    --viz-surface: var(--bs-body-bg, #fcfcfb);
    --viz-text: #0b0b0b;
    --viz-text-2: #52514e;
    --viz-grid: #e6e5e1;
    --series-1: #2a78d6;  /* blue   — applications / entered */
    --series-2: #eb6834;  /* orange — hires / dropped */
    --series-3: #1baf7a;  /* aqua   — third measure */
  }
  [data-bs-theme="dark"] .viz {
    --viz-text: #ffffff;
    --viz-text-2: #c3c2b7;
    --viz-grid: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-bs-theme="light"]) .viz {
      --viz-text: #ffffff;
      --viz-text-2: #c3c2b7;
      --viz-grid: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
    }
  }
  @media print {
    .viz-noprint { display: none !important; }
    .viz-card { break-inside: avoid; }
  }
</style>
